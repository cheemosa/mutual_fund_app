name: NAV Ingestion

on:
  schedule:
    - cron: "00 18 * * 1-5"
  workflow_dispatch:

jobs:
  ingest-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        
      - name: Run NAV ingestion
        run: npx tsx src/scripts/runNavIngestion.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}